<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:0.05" />
    </linearGradient>
    <radialGradient id="grad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <circle cx="900" cy="150" r="300" fill="url(#grad2)"/>
  
  <!-- Border -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#14b8a6" stroke-width="2" rx="20"/>
  
  <!-- Content -->
  <text x="100" y="180" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
    Pedro
  </text>
  
  <text x="100" y="260" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#14b8a6">
    Desenvolvedor Full Stack
  </text>
  
  <text x="100" y="320" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#9ca3af">
    Engenharia de Qualidade " Automação de QA
  </text>
  
  <!-- Badge -->
  <rect x="100" y="380" width="280" height="50" rx="25" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-width="2"/>
  <circle cx="130" cy="405" r="6" fill="#14b8a6"/>
  <text x="150" y="412" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#14b8a6">
    Disponível para projetos
  </text>
  
  <!-- Footer -->
  <text x="100" y="540" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#6b7280">
    pedrodevx.netlify.app
  </text>
</svg>
